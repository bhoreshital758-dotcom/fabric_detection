"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "dist"
  command = "npm run build"
  environment = { NODE_VERSION = "20" }

# Optional: Proxy API requests to your hosted backend
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR_BACKEND_URL.hf.space/api/:splat"
#   status = 200
#   force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
